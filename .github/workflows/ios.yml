name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: 4.2.2
          use-dotnet: false

      - name: Export iOS Xcode Project
        run: |
          mkdir -p build/ios
          godot --headless --path godot_duel --export-release "iOS" build/ios/BoardDuel_iOS.zip
          cd build/ios
          unzip -q BoardDuel_iOS.zip -d xcode

      - name: Upload iOS Xcode project artifact
        uses: actions/upload-artifact@v4
        with:
          name: BoardDuel-iOS-Xcode
          path: build/ios/xcode